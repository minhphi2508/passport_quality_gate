[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "passport-quality-gate"
version = "0.1.3"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "opencv-python-headless>=4.10,<6", "PyYAML>=6,<7", "ultralytics>=8.3,<9"]
[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
passport_quality_gate = ["defaults.yaml", "assets/*.yaml", "assets/*.pt"]
